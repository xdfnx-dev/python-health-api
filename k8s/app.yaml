apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-api
  labels: {app: health-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: health-api}}
  template:
    metadata: {labels: {app: health-api}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/OWNER/python-health-api:latest
          ports: [{name: http, containerPort: 8000}]
          env: [{name: APP_VERSION, value: "0.1.0"}]
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: health-api}
spec:
  selector: {app: health-api}
  ports: [{name: http, port: 80, targetPort: http}]
