name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
  image:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest
      - uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: 'ghcr.io/${{ github.repository }}:${{ github.sha }}', severity: 'CRITICAL,HIGH', ignore-unfixed: true}
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: |
          mkdir -p "$HOME/.kube"
          printf '%s' '${{ secrets.KUBECONFIG }}' > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl apply -f k8s/app.yaml
          kubectl -n default set image deployment/health-api api=ghcr.io/${{ github.repository }}:${{ github.sha }}
          kubectl -n default rollout status deployment/health-api --timeout=120s
